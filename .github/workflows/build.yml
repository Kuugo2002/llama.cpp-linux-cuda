name: Build llama.cpp (Linux CUDA)

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: CUDA version to build
        required: true
        default: "13.2"
        type: choice
        options:
          - "13.2"
          - "13.0"
          - "12.9"
      llama_ref:
        description: llama.cpp branch, tag, or commit
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: llama-cpp-linux-cuda-${{ github.ref }}-${{ inputs.llama_ref }}-${{ inputs.cuda_version }}
  cancel-in-progress: false

jobs:
  build:
    name: CUDA ${{ inputs.cuda_version }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LLAMA_REF: ${{ inputs.llama_ref }}
      CUDA_VERSION: ${{ inputs.cuda_version }}

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Install dependencies and CUDA toolkit
        run: bash scripts/install-cuda.sh

      - name: Build and package llama.cpp
        run: bash scripts/build.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-linux-x86_64-cuda-${{ inputs.cuda_version }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
